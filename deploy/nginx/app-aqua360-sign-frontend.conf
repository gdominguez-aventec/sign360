server {
    listen 443 ssl;
    server_name app-aqua360-sign.aqua360.cloud;

    ssl_certificate     /etc/nginx/ssl/cloudflare_origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare_origin.key;

    gzip on;
    gzip_types text/plain application/xml text/css application/javascript;
    gzip_min_length 1000;

    location / {
        proxy_redirect off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    1m;
        proxy_connect_timeout 1m;
        proxy_pass http://127.0.0.1:3006;
    }

    error_log  /var/log/nginx/app-aqua360-sign-frontend-error.log;
    access_log /var/log/nginx/app-aqua360-sign-frontend-access.log;
}
