# API d'app.aqua360-sign. El certificat és el d'origen de Cloudflare (*.aqua360.cloud),
# el mateix que fan servir la resta de vhosts de la màquina.
server {
    listen 443 ssl;
    server_name api-app-aqua360-sign.aqua360.cloud;

    ssl_certificate     /etc/nginx/ssl/cloudflare_origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare_origin.key;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/app-aqua360-sign/backend/static/;
    }

    # El `media/` no es publica directament: els documents només es serveixen
    # a través de l'API, que en comprova l'autenticació.

    location / {
        include proxy_params;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_pass http://unix:/run/app_aqua360_sign_backend.sock;
    }

    # Ha d'encabir els PDF que es pugen (DOCUMENT_MAX_UPLOAD_SIZE)
    client_max_body_size 20M;

    error_log  /var/log/nginx/app-aqua360-sign-backend-error.log;
    access_log /var/log/nginx/app-aqua360-sign-backend-access.log;
}
