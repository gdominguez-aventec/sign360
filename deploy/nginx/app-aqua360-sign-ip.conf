# ACCÉS TEMPORAL PER IP, mentre no hi hagi DNS.
#
# Tot sota un sol origen (http://37.27.209.18): el frontal a l arrel i l API
# sota /api/, de manera que el navegador no fa cap petició entre orígens i no
# cal tocar la configuració de CORS.
#
# És HTTP pla: les contrasenyes i els tokens viatgen sense xifrar. Aquest fitxer
# s ha de desactivar quan els vhosts amb domini i HTTPS entrin en servei.
server {
    listen 80;
    server_name 37.27.209.18;

    # Estàtics de Django (admin, DRF). El frontal no fa servir /static/.
    location /static/ {
        alias /var/www/app-aqua360-sign/backend/static/;
    }

    location /api/ {
        include proxy_params;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        client_max_body_size 20M;
        # La barra final del destí és el que treu el prefix /api abans de
        # passar la petició a Django.
        proxy_pass http://unix:/run/app_aqua360_sign_backend.sock:/;
    }

    location / {
        proxy_redirect off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    1m;
        proxy_connect_timeout 1m;
        proxy_pass http://127.0.0.1:3006;
    }

    error_log  /var/log/nginx/app-aqua360-sign-ip-error.log;
    access_log /var/log/nginx/app-aqua360-sign-ip-access.log;
}
